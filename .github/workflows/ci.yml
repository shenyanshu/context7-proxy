# CI 常规门禁：主干 push 与所有 PR。
# 单 job 且前端构建在前：Go 的 go:embed all:dist 要求 web/dist 存在才能编译，
# 顺序与 Dockerfile 一致——dist 永远现场构建，不进版本库。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # tsc -b && vite build：类型错误在 CI 拦截，同时产出 go:embed 所需的 dist
      - run: npm run build
        working-directory: web

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # gofmt 有任何输出即失败：格式问题不等到 review 才发现
      - name: gofmt 检查
        run: test -z "$(gofmt -l cmd internal web)"
      - run: go vet ./...
      - run: go test -race ./...
