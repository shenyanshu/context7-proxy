# 镜像发布：v* tag 或手动触发 → 先跑测试 → 构建并推送 GHCR。
# GHCR 用内置 GITHUB_TOKEN 免密推送，无需配置任何额外凭证。
# 仅 linux/amd64（用户确认的部署目标）；需要 arm64 时再加 platforms，不预置。
name: Docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # 发布前再测一次：tag 可能切自未经 CI 的提交，不测就推等于裸奔。
  # 先构建前端：go:embed all:dist 要求 web/dist 存在才能编译（与 ci.yml 同因）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # runner 默认 builder 是 docker 驱动，不支持 GHA 缓存导出
      # （Cache export is not supported for the docker driver），
      # 先建 docker-container 驱动 builder，type=gha 缓存才能生效
      - uses: docker/setup-buildx-action@v3
      # GHCR 要求镜像名全小写，仓库路径可能含大写字母（如 Context7-Proxy）。
      # 用 tr 而非 bash4 的 ${var,,}：行为相同且任何 shell 可验证
      - name: 计算小写镜像名
        run: echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      # tag 事件：镜像带版本号 + latest；手动触发：只带分支名和 sha，不挪 latest
      - name: 计算标签
        run: |
          TAGS="${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:sha-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "TAGS=${TAGS}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.TAGS }}
          # GHA 内置缓存后端：依赖层与前端构建层跨流水线复用
          cache-from: type=gha
          cache-to: type=gha,mode=max
