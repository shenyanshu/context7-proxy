# 单服务编排：部署侧只拉镜像，构建职责全在 GitHub Actions
#（见 .github/workflows/docker.yml）。不引入网络、健康探针、多副本等
# 编排概念——单二进制 + 单卷就是本服务的全部拓扑，多了只是负债。

services:
  proxy:
    # 真实镜像：发版 tag（v*）自动推送 GHCR（docker.yml）
    image: ghcr.io/shenyanshu/context7-proxy:latest
    ports:
      - "8080:8080"
    environment:
      # MASTER_KEY 是唯一凭证（REST/MCP/管理界面共用）。默认给一个占位值，
      # 生产部署务必用环境变量覆盖：MASTER_KEY=你的密钥 docker compose up -d
      MASTER_KEY: ${MASTER_KEY:-change-me-please}
      # 数据库落在 compose 文件同目录的 ./data 下，容器重建数据不丢
      DB_PATH: /data/proxy.db
    restart: unless-stopped
    volumes:
      - ./data:/data
