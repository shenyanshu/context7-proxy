# 单服务编排：部署侧只拉镜像，构建职责全在 GitHub Actions
#（见 .github/workflows/docker.yml）。不引入网络、健康探针、多副本等
# 编排概念——单二进制 + 单卷就是本服务的全部拓扑，多了只是负债。

services:
  proxy:
    # 镜像来自 GHCR，例如 ghcr.io/<owner>/<repo>:v1.0.0（或 :latest）。
    # 未设置 C7P_IMAGE 直接拒绝启动，防止误拉/误起。
    image: ${C7P_IMAGE:?C7P_IMAGE is required, e.g. ghcr.io/<owner>/<repo>:latest}
    ports:
      - "8080:8080"
    environment:
      # MASTER_KEY 是唯一必填凭证（REST/MCP/管理界面共用）：
      # compose 层强制从环境注入，缺失直接拒绝启动而非带空 key 起服务
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required}
      # 与镜像内 ENV 一致：数据库落在卷里，容器重建数据不丢
      DB_PATH: /data/proxy.db
    restart: unless-stopped
    volumes:
      - ./data:/data
